name: Windows installer - quiet background agent
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pc_background/requirements.txt pyinstaller
          choco install innosetup -y --no-progress
      - name: Build EXEs (console setup and silent telemetry)
        shell: pwsh
        run: |
          python -m PyInstaller --clean --onefile --console --name PulsePanelPC_Setup --paths pc_background pc_background/agent.py
          python -m PyInstaller --clean --onefile --noconsole --name PulsePanelPC_Background --paths pc_background pc_background/agent.py
      - name: Compile one Windows installer
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) { throw 'Inno Setup 6 missing' }
          & $compiler pc_background\PulsePanelPC.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload installer executable
        uses: actions/upload-artifact@v4
        with:
          name: PulsePanelPC-Installer-v0.7-Windows
          path: dist/installer/PulsePanelPC_Installer_v0.7.exe
          if-no-files-found: error
