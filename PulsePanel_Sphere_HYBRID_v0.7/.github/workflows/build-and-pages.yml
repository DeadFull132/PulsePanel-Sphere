name: Build firmware and publish web installer
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.5.6
      - name: Compile ESP32-S3 firmware
        working-directory: firmware
        run: |
          idf.py set-target esp32s3
          idf.py build
          idf.py merge-bin -o build/pulsepanel-sphere-full.bin -f raw
      - name: Generate validated installer manifest
        run: python3 tools/package_installer.py
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload installer
        uses: actions/upload-pages-artifact@v3
        with:
          path: installer
      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
